<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUFS 통합 예제</title><style>body{font-family:system-ui,sans-serif;margin:24px;background:#f6f8fb}button{padding:9px 14px;margin-right:8px}#hufs-root{margin-top:16px}</style></head><body><h1>기존 프로젝트에 HUFS WORLD 삽입</h1><button id="campus">캠퍼스</button><button id="planner">수강 추천</button><button id="basket">장바구니 콘솔 출력</button><div id="hufs-root"></div><script type="module">import {mountHufsWorld} from './hufs-embed.js';const app=mountHufsWorld(document.querySelector('#hufs-root'),{src:'./hufs-world.html',initialPage:'campus',onEvent:(type,detail)=>{console.log('[HUFS]',type,detail);if(type==='basket-changed')window.hufsLatestBasket=detail;}});document.querySelector('#campus').onclick=()=>app.openCampus();document.querySelector('#planner').onclick=()=>app.openPlanner();document.querySelector('#basket').onclick=()=>app.getBasket();</script></body></html>
