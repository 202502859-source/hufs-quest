<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUFS Quest</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10182a; }
      #game { width: 100%; height: 100%; }
      #rotate-notice { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px; box-sizing: border-box; color: #f2c94c; background: #10182a; font-family: Galmuri11, sans-serif; font-size: 22px; text-align: center; }
      #rotate-notice[hidden] { display: none; }
      #rotate-icon { width: 44px; height: 76px; box-sizing: border-box; border: 6px solid #f2c94c; background: #18233a; animation: rotate-hint 1.8s steps(6) infinite alternate; }
      @keyframes rotate-hint { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate-icon { animation: none; transform: rotate(90deg); } }
      #game canvas { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
      .ask-form { position: fixed; z-index: 10; display: flex; gap: 8px; box-sizing: border-box; font-family: Galmuri11, sans-serif; }
      .ask-form input { flex: 1; min-width: 0; box-sizing: border-box; padding: 0 10px; font: inherit; color: #ffffff; background: #0e1626; border: 3px solid #4a5f88; border-radius: 0; }
      .ask-form input::placeholder { color: #7f8ca6; }
      .ask-form button { flex: none; padding: 0 14px; font: inherit; color: #231a00; background: #f2c94c; border: 3px solid #fff0b8; border-radius: 0; cursor: pointer; }
      .ask-form button[type="button"] { color: #ffffff; background: #18233a; border-color: #4a5f88; }
      .ask-form[hidden] { display: none; }
      .ask-form input::-webkit-search-cancel-button { filter: invert(1); }
      .ask-form :focus-visible { outline: 2px solid #f2c94c; outline-offset: 1px; }
      .dl-overlay { position: fixed; inset: 0; z-index: 15; background: rgba(6, 10, 20, 0.7); }
      .dl-overlay[hidden] { display: none; }
      .dl-box { position: fixed; display: flex; flex-direction: column; box-sizing: border-box; padding: 0.9em 1.3em; color: #ffffff; background: #18233a; border: 4px solid #f2c94c; box-shadow: 4px 4px 0 #0a1020; font-family: Galmuri11, sans-serif; }
      .dl-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1em; }
      .dl-header h2 { margin: 0; font-size: 1.45em; font-weight: normal; color: #f2c94c; word-break: keep-all; }
      .dl-asof { margin: 0.35em 0 0; font-size: 0.9em; color: #a9b6cf; }
      .dl-close { flex: none; min-height: 2.6em; padding: 0 1em; font: inherit; color: #ffffff; background: #18233a; border: 3px solid #4a5f88; border-radius: 0; cursor: pointer; }
      .dl-close:hover { background: #2d3f63; }
      .dl-close:focus-visible, .dl-link:focus-visible { outline: 2px solid #f2c94c; outline-offset: 2px; }
      .dl-body { flex: 1; min-height: 0; margin-top: 0.8em; overflow-y: auto; border: 3px solid #4a5f88; background: #0e1626; }
      .dl-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      .dl-table .col-dday { width: 11%; } .dl-table .col-dept { width: 20%; } .dl-table .col-note { width: 13%; } .dl-table .col-link { width: 11%; }
      .dl-table th { position: sticky; top: 0; z-index: 1; padding: 0.55em 0.6em; text-align: left; font-weight: normal; color: #f2c94c; background: #22304d; border-bottom: 3px solid #4a5f88; }
      .dl-table td { padding: 0.6em; vertical-align: middle; border-bottom: 2px solid #22304d; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
      .dl-dday { white-space: nowrap; }
      .dl-dday.red { color: #ff6b6b; } .dl-dday.orange { color: #ffa94d; }
      .dl-dept { color: #c9d4e8; font-size: 0.92em; }
      .dl-clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
      .dl-tag { display: inline-block; padding: 0.15em 0.45em; font-size: 0.85em; white-space: nowrap; border: 2px solid #10182a; }
      .dl-tag.academic { color: #ffffff; background: #3d6098; } .dl-tag.scholarship { color: #231a00; background: #f2c94c; }
      .dl-tag.campus { color: #10261a; background: #58ad66; } .dl-tag.external { color: #ffffff; background: #8064a2; }
      .dl-link { color: #9fd0ff; white-space: nowrap; }
      .dl-link:hover { color: #ffffff; }
      .dl-empty { margin: 0; padding: 2em 1em; text-align: center; color: #a9b6cf; }
      .dl-footer { margin: 0.6em 0 0; font-size: 0.82em; color: #a9b6cf; }
      /* 학교 이메일 로그인 창: 마감 공지 창(.dl-box)과 같은 노란 테두리 · 남색 배경 · 도트 글꼴 */
      .login-overlay { position: fixed; inset: 0; z-index: 16; background: rgba(6, 10, 20, 0.75); }
      .login-overlay[hidden], .login-step[hidden], .login-hint[hidden], .login-devcode[hidden] { display: none; }
      .login-box { position: fixed; display: flex; flex-direction: column; box-sizing: border-box; overflow-y: auto; padding: 0.9em 1.3em 1.1em; color: #ffffff; background: #18233a; border: 4px solid #f2c94c; box-shadow: 4px 4px 0 #0a1020; font-family: Galmuri11, sans-serif; }
      .login-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1em; }
      .login-header h2 { margin: 0; font-size: 1.45em; font-weight: normal; color: #f2c94c; word-break: keep-all; }
      .login-step { display: flex; flex-direction: column; gap: 0.55em; margin-top: 0.7em; }
      .login-intro { margin: 0; line-height: 1.5; word-break: keep-all; }
      .login-note { margin: -0.3em 0 0; font-size: 0.88em; color: #a9b6cf; word-break: keep-all; }
      .login-row { display: flex; gap: 0.5em; }
      .login-box input, .login-box select, .login-box button { box-sizing: border-box; min-height: 2.6em; font: inherit; border-radius: 0; }
      .login-box input { min-width: 0; padding: 0 0.7em; color: #ffffff; background: #0e1626; border: 3px solid #4a5f88; }
      .login-box input::placeholder { color: #7f8ca6; }
      .login-id { flex: 1; letter-spacing: 0.08em; }
      .login-domain { flex: none; padding: 0 0.6em; color: #ffffff; background: #22304d; border: 3px solid #4a5f88; cursor: pointer; }
      .login-code { width: 100%; padding-left: 0.9em !important; font-size: 1.6em !important; letter-spacing: 0.6em; text-align: left; }
      .login-hint { margin: 0; font-size: 0.88em; color: #ffd27a; }
      .login-error { min-height: 1.3em; margin: 0; font-size: 0.92em; color: #ff9a9a; word-break: keep-all; }
      .login-error.info { color: #9df0ae; }
      .login-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.6em; }
      .login-primary { padding: 0 1.2em; color: #231a00; background: #f2c94c; border: 3px solid #fff0b8; cursor: pointer; }
      .login-secondary, .login-close { flex: none; padding: 0 1em; color: #ffffff; background: #18233a; border: 3px solid #4a5f88; cursor: pointer; }
      .login-secondary:hover:not(:disabled), .login-close:hover { background: #2d3f63; }
      .login-box button:disabled { color: #6b7690; background: #232a3a; border-color: #3d4557; cursor: default; }
      .login-box :focus-visible { outline: 2px solid #f2c94c; outline-offset: 2px; }
      .login-devcode { position: fixed; z-index: 17; transform: translateY(-100%); padding: 0.3em 0.6em; color: #231a00; background: #9df0ae; border: 2px solid #10182a; font-family: Galmuri11, sans-serif; pointer-events: none; }
      .planner-overlay { position: fixed; inset: 0; z-index: 15; background: rgba(6, 10, 20, 0.7); }
      .planner-overlay[hidden] { display: none; }
      .planner-box { position: fixed; display: flex; flex-direction: column; box-sizing: border-box; background: #18233a; border: 4px solid #f2c94c; box-shadow: 4px 4px 0 #0a1020; font-family: Galmuri11, sans-serif; }
      .planner-header { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-bottom: 3px solid #4a5f88; flex-wrap: wrap; }
      .planner-header h2 { margin: 0; font-size: 16px; font-weight: normal; color: #f2c94c; word-break: keep-all; overflow-wrap: anywhere; }
      .planner-notice { flex: 1; min-width: 160px; margin: 0; font-size: 12px; color: #ffdcaa; }
      .planner-header button { min-height: 32px; padding: 0 12px; font: inherit; font-size: 14px; color: #231a00; background: #f2c94c; border: 3px solid #fff0b8; border-radius: 0; cursor: pointer; }
      .planner-header button:focus-visible { outline: 2px solid #ffffff; outline-offset: 1px; }
      .planner-frame { flex: 1; min-height: 0; }
      .planner-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #091320; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-notice" role="alert" hidden>
      <div id="rotate-icon" aria-hidden="true"></div>
      <p id="rotate-text"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
